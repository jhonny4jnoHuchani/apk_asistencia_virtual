publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  camera: ^0.10.5+9
  geolocator: ^10.1.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.0.0
  permission_handler: ^11.3.0
  intl: ^0.20.2
  provider: ^6.1.1
  device_info_plus: ^10.0.0
  local_auth: ^2.2.0
  flutter_tts: ^4.2.5
  tutorial_coach_mark: ^1.2.11
  app_links: ^6.0.0
  image: ^4.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
