name: mi_control_upea
description: App de asistencia docente con reconocimiento facial para la UPEA.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- UI / Base ---
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  intl: ^0.20.2
  tutorial_coach_mark: ^1.2.11
  flutter_tts: ^4.2.5

  # --- Red / API ---
  http: ^1.2.0
  url_launcher: ^6.2.5
  app_links: ^6.0.0

  # --- Cámara / Imagen ---
  camera: ^0.10.5+9
  image: ^4.0.0
  image_picker: ^1.0.4
  path_provider: ^2.1.0

  # --- Ubicación / Mapas ---
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.0
  flutter_polyline_points: ^3.0.0

  # --- Seguridad / Permisos ---
  flutter_secure_storage: ^9.0.0
  local_auth: ^3.0.2
  permission_handler: ^11.3.0

  # --- Almacenamiento / Dispositivo ---
  shared_preferences: ^2.3.0
  device_info_plus: ^10.0.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/guia/rostro_cabeza.png
    - assets/guia/rostro_cuerpo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
